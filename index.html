rder-left:3px solid var(--green)}.chip.task{border-left:3px solid var(--yellow)}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;background:var(--panel2);color:var(--muted)}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:0;background:var(--panel2);color:var(--muted);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700}.tabs button.active{background:var(--accent);color:white}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--text);padding:11px;outline:0;min-width:0}.field textarea{min-height:75px;resize:vertical}.modal-back{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:23px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 90px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modal h2{margin:0;font-size:22px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}td:last-child{text-align:right}.progress{height:8px;background:var(--panel2);border-radius:10px;overflow:hidden;margin:9px 0}.progress div{height:100%;background:var(--accent);border-radius:10px}.bars{display:flex;align-items:end;height:170px;gap:10px;padding-top:15px}.barcol{flex:1;text-align:center;min-width:0}.bar{border-radius:7px 7px 0 0;background:var(--acce .chart-card{min-width:0}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.chart-sub{font-size:11px;color:var(--muted)}.donut-layout{display:flex;align-items:center;gap:22px;min-height:190px}.donut{width:158px;height:158px;border-radius:50%;position:relative;flex:0 0 158px;display:grid;place-items:center}.donut:after{content:"";position:absolute;inset:23px;border-radius:50%;background:var(--panel)}.donut-center{position:relative;z-index:1;text-align:center;max-width:110px}.donut-center strong{display:block;font-size:19px;letter-spacing:-.5px}.donut-center span{font-size:10px;color:var(--muted)}.legend{display:grid;gap:9px;min-width:0;flex:1}.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}.legend-row .legend-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.legend-row strong{font-size:12px;white-space:nowrap}.trend-wrap{width:100%;overflow:hidden}.trend-svg{display:block;width:100%;height:auto;min-width:460px}.chart-scroll{overflow-x:auto}.chart-legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}.chart-legend span{display:flex;align-items:center;gap:6px}.chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}.chart-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.chart-kpi{background:var(--panel2);border-radius:12px;padding:11px}.chart-kpi span{display:block;font-size:10px;color:var(--muted)}.chart-kpi strong{display:block;font-size:15px;margin-top:5px;overflow-wrap:anywhere}.budget-row{margin:13px 0}.budget-track{height:9px;border-radius:20px;background:var(--panel2);overflow:hidden;margin-top:8px}.budget-track span{height:100%;display:block;border-radius:20px}@media(max-width:600px){.donut-layout{gap:13px;min-height:0}.donut{width:124px;height:124px;flex-basis:124px}.donut:after{inset:19px}.donut-center strong{font-size:15px}.legend{gap:7px}.legend-row{font-size:11px}.chart-kpis{gap:6px}.chart-kpi{padding:9px}.chart-kpi strong{font-size:13px}}
.bottom{display:none}.toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px 17px;z-index:80;box-shadow:var(--shadow)}.check{accent-color:var(--accent);width:18px;height:18px}.hint{font-size:12px;line-height:1.6;color:var(--muted)}@media(max-width:900px){.side{width:75px;padding:24px 8px}.brand{font-size:17px;padding:0 5px 22px}.brand small{display:none}.nav button{font-size:0;text-align:center;padding:13px 0}.nav button span{font-size:20px;margin:0}.main{padding:24px 20px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:600px){.side{display:none}.main{padding:22px 13px 100px}.h1{font-size:27px}.top{align-items:flex-start}.top .actions{justify-content:flex-end}.grid{gap:9px}.card{padding:15px;border-radius:16px}.stat .value{font-size:22px}.day{min-height:75px;padding:5px 3px;border-radius:8px}.day .number{font-size:11px}.chip{font-size:8px;padding:3px 2px}.calendar{gap:3px}.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px max(9px,env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center;padding:5px 1px}.bottom button b{font-size:20px}.bottom button.active{color:var(--accent)}.toast{bottom:85px;left:12px;right:12px}}

</style></head><body><div id="app"></div><div id="modal-root"></div><script>
(()=>{'use strict';const KEY='life_calendar_v1';const today=()=>localDate(new Date());const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parseDate=s=>new Date(s+'T12:00:00');const addDays=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return localDate(d)};const addMonths=(s,n)=>{let d=parseDate(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return localDate(d)};const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(+n||0);const fmt=s=>s?parseDate(s).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}):'';const monthLabel=s=>parseDate(s.slice(0,7)+'-01').toLocaleDateString('it-IT',{month:'long',year:'numeric'});const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=s=>Number(s)||0;const startMonth=s=>s.slice(0,7)+'-01';const defaults={events:[],payments:[],tasks:[],budgets:{},settings:{theme:'auto',notifications:false}};let db;try{db={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=structuredClone(defaults)};for(let k of ['events','payments','tasks'])if(!Array.isArray(db[k]))db[k]=[];if(!db.budgets||typeof db.budgets!=='object')db.budgets={};db.settings={...defaults.settings,...db.settings};let state={view:'home',date:today(),month:startMonth(today()),calView:'month',financeMonth:startMonth(today()),financeTab:'all',search:''};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Impossibile salvare: memoria del browser esaurita. Esporta un backup.')}};const el=id=>document.getElementById(id);const isoMonth=s=>s.slice(0,7);const recurring=(o,date)=>{if(date<o.date||(o.until&&date>o.until))return false;const f=o.repeat||'none';if(f==='none')return date===o.date;const a=parseDate(o.date),b=parseDate(date),days=Math.round((b-a)/86400000);if(f==='daily')return true;if(f==='weekly')return days%7===0;if(f==='monthly')return a.getDate()===b.getDate()|| (a.getDate()>new Date(b.getFullYear(),b.getMonth()+1,0).getDate()&&b.getDate()===new Date(b.getFullYear(),b.getMonth()+1,0).getDate());if(f==='yearly')return a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();return false};const occurrenceId=(o,date)=>o.id+'@'+date;const isPaid=(p,date)=>p.paidDates?.includes(date)||false;const occurrences=(type,from,to)=>{let out=[];let a=db[type];for(let o of a){let date=from;while(date<=to){if(recurring(o,date)&&!o.skippedDates?.includes(date))out.push({...o,occDate:date,occId:occurrenceId(o,date)});date=addDays(date,1)}}return out.sort((a,b)=>a.occDate.localeCompare(b.occDate)||(a.time||'').localeCompare(b.time||''))};const monthRange=m=>[startMonth(m),addDays(addMonths(startMonth(m),1),-1)];const monthly=(type,m)=>occurrences(type,...monthRange(m));const paymentStats=m=>{let p=monthly('payments',m),expenses=p.filter(x=>x.kind!=='income'),income=p.filter(x=>x.kind==='income');return {planned:expenses.reduce((s,x)=>s+n(x.amount),0),paid:expenses.filter(x=>isPaid(x,x.occDate)).reduce((s,x)=>s+n(x.amount),0),income:income.reduce((s,x)=>s+n(x.amount),0),received:income.filter(x=>isPaid(x,x.occDate)).reduce((s,x)=>s+n(x.amount),0),count:expenses.length}};const categories=['Casa','Auto','Finanziamenti','Abbonamenti','Alimentari','Salute','Shopping','Trasporti','Svago','Lavoro','Altro'];const theme=()=>{let t=db.settings.theme;document.body.classList.toggle('light',t==='light'||(t==='auto'&&matchMedia('(prefers-color-scheme: light)').matches))};theme();matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',theme);const icon={home:'⌂',calendar:'▦',finance:'€',tasks:'✓',analysis:'▥',settings:'⚙'};const nav=[['home','Home'],['calendar','Calendario'],['finance','Finanze'],['tasks','Attività'],['analysis','Analisi'],['settings','Impostazioni']];const btn=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;const item=(title,sub,right,color='var(--accent)',act='')=>`<div class="item" ${act?`data-action="${act}" style="cursor:pointer"`:''}><div class="dot" style="background:${color}"></div><div class="info"><strong>${esc(title)}</strong><div class="sub">${esc(sub)}</div></div><div class="amount">${right}</div></div>`;const stat=(label,value,foot)=>`<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><div class="foot">${foot}</div></div>`;const empty=msg=>`<div class="empty">${msg}</div>`;const sum=(arr)=>arr.reduce((s,x)=>s+n(x.amount),0);

const chartColors=['#788cff','#50d6a2','#ff777d','#ffc36a','#b28cff','#4fc3d8','#ff9f7a','#9ca3af','#e879b0','#a3d977','#d6a85f'];
function donutChart(items,total,centerLabel='Totale',emptyLabel='Nessun dato'){
  let clean=items.filter(x=>n(x.value)>0),sumValue=clean.reduce((a,x)=>a+n(x.value),0);
  if(!sumValue)return `<div class="empty">${emptyLabel}</div>`;
  let cursor=0,stops=clean.map((x,i)=>{let start=cursor;cursor+=n(x.value)/sumValue*100;return `${x.color||chartColors[i%chartColors.length]} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`}).join(',');
  return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><strong>${money(total??sumValue)}</strong><span>${esc(centerLabel)}</span></div></div><div class="legend">${clean.slice(0,7).map((x,i)=>`<div class="legend-row"><i class="legend-dot" style="background:${x.color||chartColors[i%chartColors.length]}"></i><span class="legend-name">${esc(x.label)}</span><strong>${money(x.value)}</strong></div>`).join('')}${clean.length>7?`<div class="chart-sub">+ altre ${clean.length-7} categorie</div>`:''}</div></div>`;
}
function categoryData(m){let sums={};monthly('payments',m).filter(x=>x.kind!=='income').forEach(x=>{let k=x.category||'Altro';sums[k]=(sums[k]||0)+n(x.amount)});return Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([label,value],i)=>({label,value,color:chartColors[i%chartColors.length]}))}
function trendChart(stats){
  let max=Math.max(1,...stats.flatMap(x=>[x.income,x.planned])),w=720,h=235,top=18,bottom=36,plot=h-top-bottom,group=w/stats.length,barW=Math.min(13,group*.28);
  let grid=[0,.25,.5,.75,1].map(t=>{let y=top+plot*(1-t);return `<line x1="34" y1="${y}" x2="${w-8}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="28" y="${y+4}" text-anchor="end" fill="var(--muted)" font-size="10">${Math.round(max*t).toLocaleString('it-IT')}</text>`}).join('');
  let bars=stats.map((x,i)=>{let cx=40+i*group+group/2,hi=x.income/max*plot,he=x.planned/max*plot;return `<rect x="${cx-barW-2}" y="${top+plot-hi}" width="${barW}" height="${Math.max(1,hi)}" rx="4" fill="#50d6a2"><title>${esc(monthLabel(x.m))} · Entrate ${money(x.income)}</title></rect><rect x="${cx+2}" y="${top+plot-he}" width="${barW}" height="${Math.max(1,he)}" rx="4" fill="#788cff"><title>${esc(monthLabel(x.m))} · Uscite ${money(x.planned)}</title></rect><text x="${cx}" y="${h-12}" text-anchor="middle" fill="var(--muted)" font-size="10">${parseDate(x.m).toLocaleDateString('it-IT',{month:'short'})}</text>`}).join('');
  return `<div class="chart-scroll"><svg class="trend-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Confronto mensile tra entrate e uscite">${grid}${bars}</svg></div><div class="chart-legend"><span><i style="background:#50d6a2"></i>Entrate previste</span><span><i style="background:#788cff"></i>Uscite previste</span></div>`;
}
function paidStatusData(m){let p=monthly('payments',m).filter(x=>x.kind!=='income'),paid=p.filter(x=>isPaid(x,x.occDate)).reduce((a,x)=>a+n(x.amount),0),unpaid=p.filter(x=>!isPaid(x,x.occDate)).reduce((a,x)=>a+n(x.amount),0);return [{label:'Già pagato',value:paid,color:'#50d6a2'},{label:'Da pagare',value:unpaid,color:'#788cff'}]}

function home(){let m=isoMonth(today()),p=paymentStats(m),cats=categoryData(m),statusData=paidStatusData(m),events=occurrences('events',today(),addDays(today(),7)),payments=occurrences('payments',today(),addDays(today(),30)).filter(x=>!isPaid(x,x.occDate)),tasks=db.tasks.filter(x=>!x.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `<div class="grid">${stat('Spese previste',money(p.planned),'Questo mese')}${stat('Già pagato',money(p.paid),'Pagamenti confermati')}${stat('Da pagare',money(p.planned-p.paid),'Residuo del mese')}${stat('Entrate previste',money(p.income),'Incassate '+money(p.received))}</div><div class="two"><section class="card chart-card"><div class="chart-head"><h3 class="section-title" style="margin:0">Le tue spese</h3><span class="chart-sub">${monthLabel(m)}</span></div>${donutChart(cats,cats.reduce((a,x)=>a+x.value,0),'Per categoria','Nessuna spesa registrata')}</section><section class="card chart-card"><div class="chart-head"><h3 class="section-title" style="margin:0">Pagamenti del mese</h3><span class="chart-sub">Avanzamento</span></div>${donutChart(statusData,p.planned,'Pagamenti','Nessun pagamento registrato')}</section></div><div class="two"><section class="card"><h3 class="section-title">Prossimi appuntamenti</h3>${events.length?events.slice(0,7).map(x=>item(x.title,fmt(x.occDate)+' · '+(x.allDay?'Tutto il giorno':x.time||'Senza orario'),'',x.color||'var(--accent)',`edit:event:${x.id}`)).join(''):empty('Nessun appuntamento nei prossimi 7 giorni')}${btn('Apri calendario','view:calendar','small')}</section><section class="card"><h3 class="section-title">Pagamenti in arrivo</h3>${payments.length?payments.slice(0,6).map(x=>item(x.title,fmt(x.occDate)+(x.occDate<today()?' · Scaduto':''),money(x.amount),x.kind==='income'?'var(--green)':'var(--red)',`edit:payment:${x.id}`)).join(''):empty('Nessun pagamento imminente')}${btn('Gestisci finanze','view:finance','small')}</section></div><div class="two"><section class="card"><h3 class="section-title">Attività da completare</h3>${tasks.length?tasks.slice(0,6).map(x=>item(x.title,(x.date?fmt(x.date):'Senza scadenza')+' · '+(x.priority||'Normale'),'','var(--yellow)',`edit:task:${x.id}`)).join(''):empty('Nessuna attività in sospeso')}${btn('Nuova attività','new:task','small')}</section><section class="card"><h3 class="section-title">Riepilogo rapido</h3>${item('Saldo previsto', 'Entrate meno spese del mese',money(p.income-p.planned),'var(--green)')}${item('Appuntamenti oggi','Eventi in calendario',String(occurrences('events',today(),today()).length))}${item('Attività aperte','Da completare',String(tasks.length),'var(--yellow)')}<p class="hint">Il saldo previsto è una differenza tra entrate e uscite pianificate, non il saldo del conto corrente.</p></section></div>`}
function calendar(){let m=state.month,selected=state.date;let tools=`<div class="toolbar"><div class="actions">${btn('‹','prevmonth','small')}<span class="month">${monthLabel(m)}</span>${btn('›','nextmonth','small')}${btn('Oggi','today','small')}</div><div class="tabs">${['month','week','day','year'].map(v=>`<button data-action="calview:${v}" class="${state.calView===v?'active':''}">${({month:'Mese',week:'Settimana',day:'Giorno',year:'Anno'})[v]}</button>`).join('')}</div></div>`;let range=monthRange(m),start=parseDate(range[0]);let content='';if(state.calView==='year'){content=`<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${Array.from({length:12},(_,i)=>{let mm=m.slice(0,4)+'-'+String(i+1).padStart(2,'0')+'-01',cnt=monthly('events',mm).length;return `<button class="card" data-action="gomonth:${mm}" style="text-align:left;color:var(--text)"><strong>${monthLabel(mm)}</strong><div class="sub">${cnt} eventi · ${monthly('payments',mm).length} movimenti</div></button>`}).join('')}</div>`}else if(state.calView==='day'||state.calView==='week'){let from=state.calView==='day'?selected:addDays(selected,-((parseDate(selected).getDay()+6)%7)),to=state.calView==='day'?selected:addDays(from,6);let d=from;let blocks=[];while(d<=to){let e=occurrences('events',d,d),p=occurrences('payments',d,d),t=occurrences('tasks',d,d);blocks.push(`<div class="card" style="margin-bottom:10px"><strong>${fmt(d)}</strong>${[...e.map(x=>item(x.title,(x.time||'Tutto il giorno')+' · Evento','',x.color||'var(--accent)',`edit:event:${x.id}`)),...p.map(x=>item(x.title,'Pagamento · '+(isPaid(x,d)?'Confermato':'Da confermare'),money(x.amount),'var(--red)',`edit:payment:${x.id}`)),...t.map(x=>item(x.title,'Attività','','var(--yellow)',`edit:task:${x.id}`))].join('')||empty('Nessun impegno')}</div>`);d=addDays(d,1)}content=blocks.join('')}else{let offset=(start.getDay()+6)%7,first=addDays(range[0],-offset),all=[];for(let i=0;i<42;i++){let d=addDays(first,i),ev=occurrences('events',d, function finance(){let m=state.financeMonth,stats=paymentStats(m),p=monthly('payments',m).filter(x=>state.financeTab==='all'||(state.financeTab==='income'?x.kind==='income':state.financeTab==='expenses'?x.kind!=='income':state.financeTab==='unpaid'?!isPaid(x,x.occDate):isPaid(x,x.occDate))),cats=categoryData(m),statusData=paidStatusData(m);return `<div class="toolbar"><div class="actions">${btn('‹','finprev','small')}<span class="month">${monthLabel(m)}</span>${btn('›','finnext','small')}</div>${btn('+ Movimento','new:payment','primary')}</div><div class="grid">${stat('Spese previste',money(stats.planned),'Tutte le uscite')}${stat('Già pagato',money(stats.paid),'Uscite confermate')}${stat('Ancora da pagare',money(stats.planned-stats.paid),'Residuo pianificato')}${stat('Entrate previste',money(stats.income),'Ricevute '+money(stats.received))}</div><div class="two"><section class="card chart-card"><div class="chart-head"><h3 class="section-title" style="margin:0">Dove vanno i tuoi soldi</h3><span class="chart-sub">${monthLabel(m)}</span></div>${donutChart(cats,cats.reduce((a,x)=>a+x.value,0),'Uscite per categoria','Nessuna spesa registrata nel mese')}</section><section class="card chart-card"><div class="chart-head"><h3 class="section-title" style="margin:0">Stato dei pagamenti</h3><span class="chart-sub">Avanzamento</span></div>${donutChart(statusData,stats.planned,'Pagamenti','Nessun pagamento nel mese')}<div class="chart-kpis"><div class="chart-kpi"><span>Completamento</span><strong>${stats.planned?Math.round(stats.paid/stats.planned*100):0}%</strong></div><div class="chart-kpi"><span>Movimenti</span><strong>${p.length}</strong></div><div class="chart-kpi"><span>Saldo previsto</span><strong>${money(stats.income-stats.planned)}</strong></div></div></section></div><div class="two"><section class="card"><div class="toolbar"><h3 class="section-title" style="margin:0">Movimenti</h3><div class="tabs">${[['all','Tutti'],['expenses','Uscite'],['income','Entrate'],['unpaid' function analysis(){let months=Array.from({length:12},(_,i)=>{let d=parseDate(startMonth(today()));d.setMonth(d.getMonth()-11+i);return localDate(d)}),stats=months.map(m=>({...paymentStats(m),m})),totals=stats.reduce((a,x)=>({planned:a.planned+x.planned,paid:a.paid+x.paid,income:a.income+x.income,received:a.received+x.received}),{planned:0,paid:0,income:0,received:0}),current=isoMonth(today()),cats=categoryData(current),tasksDone=db.tasks.filter(x=>x.done).length,tasksOpen=db.tasks.filter(x=>!x.done).length,taskTotal=tasksDone+tasksOpen;return `<div class="grid">${stat('Uscite 12 mesi',money(totals.planned),'Previste')}${stat('Uscite confermate',money(totals.paid),'Ultimi 12 mesi')}${stat('Entrate 12 mesi',money(totals.income),'Previste')}${stat('Saldo previsto',money(totals.income-totals.planned),'Entrate meno uscite')}</div><section class="card chart-card" style="margin-top:15px"><div class="chart-head"><h3 class="section-title" style="margin:0">Entrate e uscite · ultimi 12 mesi</h3><span class="chart-sub">Confronto mensile</span></div>${trendChart(stats)}<div class="chart-kpis"><div class="chart-kpi"><span>Entrate previste</span><strong>${money(totals.income)}</strong></div><div class="chart-kpi"><span>Uscite previste</span><strong>${money(totals.planned)}</strong></div><div class="chart-kpi"><span>Saldo netto</span><strong>${money(totals.income-totals.planned)}</strong></div></div></section><div class="two"><section class="card chart-card"><div class="chart-head"><h3 class="section-title" style="margin:0">Spese per categoria</h3><span class="chart-sub">${monthLabel(current)}</span></div>${donutChart(cats,cats.reduce((a,x)=>a+x.value,0),'Spese mese','Nessuna spesa registrata')}</section><section class="card chart-card"><div class="chart-head"><h3 class="section-title" style="margin:0">Attività completate</h3><span class="chart-sub">Tutte le attività</span></div>${donutChart([{label:'Completate',value:tasksDone,color:'#50d6a2'},{label:'Da completare',value:tasksOp function settings(){return `<div class="two"><section class="card"><h3 class="section-title">Aspetto e preferenze</h3><div class="field"><label>Tema</label><select id="theme-select"><option value="auto" ${db.settings.theme==='auto'?'selected':''}>Automatico (sistema)</option><option value="dark" ${db.settings.theme==='dark'?'selected':''}>Scuro</option><option value="light" ${db.settings.theme==='light'?'selected':''}>Chiaro</option></select></div><br>${btn('Abilita notifiche','notifications','small')}<p class="hint">Le notifiche browser richiedono permesso e un contesto sicuro (HTTPS o localhost). Il controllo delle scadenze funziona mentre l'app è aperta: non è un sistema di avvisi garantiti a browser chiuso.</p></section><section class="card"><h3 class="section-title">I tuoi dati</h3><div class="actions">${btn('Esporta backup JSON','backup','small')}${btn('Ripristina backup','restore','small')}${btn('Esporta CSV','csv','small')}${btn('Esporta eventi .ics','ics','small')}${btn('Importa eventi .ics','importics','small')}${btn('Stampa / PDF','print','small')}</div><p class="hint">Il backup JSON contiene tutti i dati dell'app. Il file .ics è compatibile con i calendari che supportano iCalendar, incluso Apple Calendar; non è una sincronizzazione continua.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">${btn('Elimina tutti i dati','reset','danger small')}</section></div><section class="card" style="margin-top:15px"><h3 class="section-title">Informazioni</h3><p class="hint">LIFE funziona localmente nel browser. Non è collegata a conti bancari, Apple Calendar o servizi cloud. Il salvataggio dipende dalla memoria del browser: conserva backup regolari, soprattutto prima di cancellare i dati del browser o cambiare dispositivo.</p></section>`}
const titles={home:'La tua giornata',calendar:'Calendario',finance:'Finanze',tasks:'Attività',analysis:'Analisi',settings:'Impostazioni'};function render(){theme();let view=state.view;el('app').innerHTML=`<div class="app"><aside class="side"><div class="brand">LIFE<b>.</b><small>CALENDAR & FINANCE</small></div><nav class="nav">${nav.map(([k,label])=>`<button data-action="view:${k}" class="${k===view?'active':''}"><span>${icon[k]}</span>${label}</button>`).join('')}</nav></aside><main class="main"><div class="top"><div><div class="eyebrow">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1 class="h1">${titles[view]}</h1></div><div class="actions">${btn('⌕ Cerca','search','small')}${btn('+ Aggiungi','quickadd','primary')}</div></div>${({home,calendar,finance,tasks,analysis,settings})[view]()}</main><nav class="bottom">${nav.slice(0,5).map(([k,label])=>`<button class="${view===k?'active':''}" data-action="view:${k}"><b>${icon[k]}</b>${label}</button>`).join('')}<button class="${view==='settings'?'active':''}" data-action="view:settings"><b>⚙</b>Altro</button></nav></div>`;let ts=el('theme-select');if(ts)ts.onchange=e=>{db.settings.theme=e.target.value;save();theme()}}
function showModal(title,html,buttons=''){el('modal-root').innerHTML=`<div class="modal-back" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="btn small" data-action="close">✕</button></div>${html}${buttons}</div></div>`;el('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')close()})}function close(){el('modal-root').innerHTML=''}function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function select(label,name,options,value){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}const repeats=[['none','Non ripetere'],['daily','Ogni giorno'],['weekly','Ogni settimana'],['monthly','Ogni mese'],['yearly','Ogni anno']];function edit(type,id){let col=type==='event'?'events':type==='payment'?'payments':'tasks',o=id?db[col].find(x=>x.id===id):null;if(id&&!o)return;let v=o||{date:state.date||today(),repeat:'none',amount:'',kind:'expense',category:'Altro',priority:'Normale',color:'#778bff'};let content=`<form id="editform"><div class="formgrid">${field('Titolo *','title',v.title||'','text','required')}${field('Data *','date',v.date,'date','required')}${type==='event'?`${field('Ora inizio','time',v.time||'','time')}${field('Ora fine','endTime',v.endTime||'','time')}${select('Ricorrenza','repeat',repeats,v.repeat||'none')}${field('Ripeti fino al (opzionale)','until',v.until||'','date')}${field('Luogo','location',v.location||'')}${field('Colore','color',v.color||'#778bff','color')}<div class="field"><label><input type="checkbox" name="allDay" ${v.allDay?'checked':''}> Tutto il giorno</label></div>`:type==='payment'?`${field('Importo € *','amount',v.amount||'','number','required min="0.01" step="0.01"')}${select('Tipo','kind',[['expense','Uscita / pagamento'],['income','Entrata']],v.kind||'expense')}${select('Categoria','category',categories.map(x=>[x,x]),v.category||'Altro')}${select('Ricorrenza','repeat',repeats,v.repeat||'none')}${field('Ripeti fino al (opzionale)','until',v.until||'','date')}${field('Metodo di pagamento','method',v.method||'')}${field('Numero di rate (opzionale)','installments',v.installments||'','number','min="1" step="1"')}`:`${select('Priorità','priority',[['Bassa','Bassa'],['Normale','Normale'],['Alta','Alta']],v.priority||'Normale')}${select('Ricorrenza','repeat',repeats,v.repeat||'none')}${field('Ripeti fino al (opzionale)','until',v.until||'','date')}`}<div class="field wide"><label>Note</label><textarea name="notes">${esc(v.notes||'')}</textarea></div></div><div class="modal-foot">${o?btn('Elimina',`delete:${type}:${id}`,'danger'):''}<button class="btn" type="button" data-action="close">Annulla</button><button class="btn primary" type="submit">Salva</button></div></form>`;showModal(o?'Modifica '+({event:'evento',payment:'movimento',task:'attività'})[type]:'Nuovo '+({event:'evento',payment:'movimento',task:'attività'})[type],content);el('editform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());data.title=data.title.trim();if(!data.title)return;if(type==='event')data.allDay=e.target.elements.allDay.checked;if(type==='payment'){data.amount=n(data.amount);if(data.amount<=0)return alert('Inserisci un importo maggiore di zero.');data.installments=data.installments?Math.max(1,Math.floor(n(data.installments))):''}if(data.until&&data.until<data.date)return alert('La data finale deve essere successiva alla data iniziale.');if(data.installments&&data.repeat==='none'&&data.installments>1)return alert('Per le rate imposta una ricorrenza mensile o un’altra frequenza.');let obj={...o,...data,id:o?.id||uid()};if(type==='payment'){obj.paidDates=o?.paidDates||[];if(data.installments&&data.repeat!== function budgets(){showModal('Budget mensili',`<form id="budgetform"><div class="formgrid">${categories.map(c=>field(c,c,db.budgets[c]||'','number','min="0" step="0.01"')).join('')}</div><div class="modal-foot"><button class="btn primary" type="submit">Salva budget</button></div></form>`);el('budgetform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let c of categories)db.budgets[c]=n(f.get(c));save();close();render()}}
function search(){showModal('Ricerca globale',`<input class="search" id="searchbox" placeholder="Cerca eventi, pagamenti e attività..." value="${esc(state.search)}"><div id="searchresults"></div>`);el('searchbox').oninput=e=>{state.search=e.target.value;searchResults()};searchResults();el('searchbox').focus()}function searchResults(){let q=state.search.toLowerCase().trim(),out=[];for(let [type,col] of [['event','events'],['payment','payments'],['task','tasks']])for(let x of db[col])if(q&&[x.title,x.notes,x.category,x.location].join(' ').toLowerCase().includes(q))out.push(item(x.title,fmt(x.date)+' · '+type,type==='payment'?money(x.amount):'',type==='payment'?'var(--red)':'var(--accent)',`edit:${type}:${x.id}`));el('searchresults').innerHTML=out.join('')||empty(q?'Nessun risultato':'Scrivi qualcosa per cercare')}
function download(name,text,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download('LIFE-backup-'+today()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2),'application/json')}function csv(){let rows=[['Tipo','Titolo','Data iniziale','Ora','Importo','Categoria','Ricorrenza','Note']];for(let [type,col] of [['Evento','events'],['Movimento','payments'],['Attività','tasks']])for(let x of db[col])rows.push([type,x.title,x.date,x.time||'',x.amount||'',x.category||'',x.repeat||'none',x.notes||'']);download('LIFE-dati-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');function ics(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LIFE Calendar//IT','CALSCALE:GREGORIAN'];for(let x of db.events){let d=x.date.replaceAll('-',''),end=addDays(x.date,1).replaceAll('-','');lines.push('BEGIN:VEVENT','UID:'+x.id+'@life-calendar','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'' ) ,'SUMMARY:'+icsEsc(x.title));if(x.allDay||!x.time){lines.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+end)}else{let st=d+'T'+x.time.replace(':','')+'00',et=d+'T'+(x.endTime||x.time).replace(':','')+'00';lines.push('DTSTART:'+st,'DTEND:'+et)}if(x.location)lines.push('LOCATION:'+icsEsc(x.location));if(x.notes)lines.push('DESCRIPTION:'+icsEsc(x.notes));if(x.repeat&&x.repeat!=='none'){let freq={daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY',yearly:'YEARLY'}[x.repeat];lines.push('RRULE:FREQ='+freq+(x.until?';UNTIL='+x.until.replaceAll('-','')+'T235959':''))}lines.push('END:VEVENT')}lines.push('END:VCALENDAR');download('LIFE-eventi.ics',lines.join('\r\n'),'text/calendar;charset=utf-8')}
function fileInput(accept,cb){let inp=document.createElement('input');inp.type='file';inp.accept=accept;inp.onchange=async()=>{if(inp.files[0]){try{await cb(await inp.files[0].text())}catch(e){alert('File non valido: '+e.message)}}};inp.click()}
function restore(){fileInput('.json,application/json',async txt=>{let obj=JSON.parse(txt),data=obj.data||obj;if(!Array.isArray(data.events)||!Array.isArray(data.payments)||!Array.isArray(data.tasks))throw Error('Struttura backup non riconosciuta');if(!confirm('Sostituire tutti i dati attuali con quelli del backup?'))return;db={...structuredClone(defaults),...data,settings:{...defaults.settings,...data.settings}};save();render();alert('Backup ripristinato')})}
function importIcs(){fileInput('.ics,text/calendar',async txt=>{let raw=txt.replace(/\r?\n[ \t]/g,'').split(/\r?\n/),events=[],current=null;for(let line of raw){if(line==='BEGIN:VEVENT')current={};else if(line==='END:VEVENT'){if(current?.date&&current?.title)events.push(current);current=null}else if(current){let i=line.indexOf(':');if(i<0)continue;let key=line.slice(0,i).split(';')[0],v=line.slice(i+1).replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';');if(key==='SUMMARY')current.title=v;if(key==='DESCRIPTION')current.notes=v;if(key==='LOCATION')current.location=v;if(key==='DTSTART'){current.date=v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8);if(v.includes('T'))current.time=v.slice(9,11)+':'+v.slice(11,13);else current.allDay=true}if(key==='DTEND'&&v.includes('T'))current.endTime=v.slice(9,11)+':'+v.slice(11,13);if(key==='RRULE'){let f=v.match(/FREQ=(DAILY|WEEKLY|MONTHLY|YEARLY)/);if(f)current.repeat=f[1].toLowerCase()}}}if(!events.length)throw Error('Nessun evento compatibile trovato');db.events.push(...events.map(x=>({...x,id:uid(),repeat:x.repeat||'none'})));save();render();alert('Importati '+events.length+' eventi. Gli eventi complessi o con fuso orario potrebbero richiedere verifica.')})}
function notifications(){if(!('Notification'in window))return alert('Notifiche non supportate in questo browser.');Notification.requestPermission().then(p=>{db.settings.notifications=p==='granted';save();alert(p==='granted'?'Notifiche abilitate mentre l’app è aperta.':'Permesso notifiche non concesso.')})}let notified=new Set();function checkNotifs(){if(!db.settings.notifications||!('Notification'in window)||Notification.permission!=='granted')return;let due=[...occurrences('payments',today(),addDays(today(),2)).filter(x=>!isPaid(x,x.occDate)).map(x=>({id:x.occId,text:`${x.title}: ${money(x.amount)} il ${fmt(x.occDate)}`})),...occurrences('events',today(),today()).map(x=>({id:x.occId,text:`Oggi: ${x.title}`}))];for(let x of due)if(!notified.has(x.id)){notified.add(x.id);new Notification('LIFE · Promemoria',{body:x.text})}}setInterval(checkNotifs,60000);
document.addEventListener('click',e=>{let target=e.target.closest('[data-action]');if(!target)return;let a=target.dataset.action,[cmd,arg,id]=a.split(':');if(cmd==='view'){state.view=arg;render()}else if(cmd==='close')close();else if(cmd==='new')edit(arg);else if(cmd==='edit'){close();edit(arg,id)}else if(cmd==='delete'){if(confirm('Eliminare questo elemento e tutte le sue ricorrenze?')){let c=arg==='event'?'events':arg==='payment'?'payments':'tasks';db[c]=db[c].filter(x=>x.id!==id);save();close();render()}}else if(cmd==='quickadd')showModal('Cosa vuoi aggiungere?',`<div class="actions">${btn('Evento','new:event','primary')}${btn('Pagamento / entrata','new:payment')}${btn('Attività','new:task')}</div>`);else if(cmd==='date'){state.date=arg;state.month=startMonth(arg);render()}else if(cmd==='prevmonth'||cmd==='nextmonth'){state.month=addMonths(state.month,cmd==='prevmonth'?-1:1);state.date=state.month;render()}else if(cmd==='today'){state.date=today();state.month=startMonth(today());render()}else if(cmd==='calview'){state.calView=arg;render()}else if(cmd==='gomonth'){state.month=arg;state.date=arg;state.calView='month';render()}else if(cmd==='finprev'||cmd==='finnext'){state.financeMonth=addMonths(state.financeMonth,cmd==='finprev'?-1:1);render()}else if(cmd==='fintab'){state.financeTab=arg;render()}else if(cmd==='togglepaid'){let x=db.payments.find(x=>x.id===arg),date=id;if(x){x.paidDates=x.paidDates||[];x.paidDates=x.paidDates.includes(date)?x.paidDates.filter(d=>d!==date):[...x.paidDates,date];save();render()}}else if(cmd==='taskdone'){let x=db.tasks.find(x=>x.id===arg);if(x){x.done=!x.done;save();render()}}else if(cmd==='budgets')budgets();else if(cmd==='search')search();else if(cmd==='backup')backup();else if(cmd==='restore')restore();else if(cmd==='csv')csv();else if(cmd==='ics')ics();else if(cmd==='importics')importIcs();else if(cmd==='print')window.print();else if(cmd==='notifications')notifications();else if(cmd==='reset'){if(confirm('ATTENZIONE: eliminare tutti i dati? Esporta prima un backup.')){if(confirm('Confermi definitivamente?')){db=structuredClone(defaults);save();render()}}}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();checkNotifs();})();
</script></body></html>
